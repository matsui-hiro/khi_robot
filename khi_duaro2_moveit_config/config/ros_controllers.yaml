# MoveIt-specific simulation settings
moveit_sim_hw_interface:
  joint_model_group: controllers_initial_group_
  joint_model_group_pose: controllers_initial_pose_
# Settings for ros_control control loop
generic_hw_control_loop:
  loop_hz: 300
  cycle_time_error_threshold: 0.01
# Settings for ros_control hardware interface
hardware_interface:
  joints:
    - lower_joint1
    - lower_joint2
    - lower_joint3
    - lower_joint4
    - upper_joint1
    - upper_joint2
    - upper_joint3
    - upper_joint4
  sim_control_mode: 1  # 0: position, 1: velocity
# Publish all joint states
# Creates the /joint_states topic necessary in ROS
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
controller_list:
  - name: lower_arm_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      - lower_joint1
      - lower_joint2
      - lower_joint3
      - lower_joint4
  - name: upper_arm_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      - upper_joint1
      - upper_joint2
      - upper_joint3
      - upper_joint4
  - name: lower_arm_tool_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      lower_joint4
  - name: upper_arm_tool_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      upper_joint4
  - name: botharms_controller
    action_ns: follow_joint_trajectory
    default: True
    type: FollowJointTrajectory
    joints:
      - lower_joint1
      - lower_joint2
      - lower_joint3
      - lower_joint4
      - upper_joint1
      - upper_joint2
      - upper_j3_obstacle_joint
      - upper_joint4